[project]
name = "cellular-inference-mesh"
version = "0.3.2"
description = "Salabim discrete-event simulation of edge-cloud LLM inference under PACELC. Companion software to the Saturated Pipeline Conjecture (Flores, 2026)."
authors = [{name = "Carlos Ulisses Flores", email = "c.ulisses@gmail.com"}]
license = "Apache-2.0"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.12"
keywords = [
  "cellular inference mesh",
  "saturated pipeline conjecture",
  "PACELC",
  "speculative decoding",
  "edge-cloud LLM inference",
  "multilingual AGV",
  "LLMOps",
  "salabim",
  "discrete-event simulation",
  "FAIR research software",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: System :: Distributed Computing",
]
dependencies = [
  "salabim==26.0.5",
  "numpy==2.4.4",
  "scipy==1.17.1",
  "matplotlib==3.10.9",
  "seaborn==0.13.2",
  "networkx==3.6.1",
  "pandas==3.0.2",
  "scienceplots==2.2.1",
]

[project.optional-dependencies]
dev = ["pytest==9.0.3", "ruff==0.5.7"]
build = ["python-docx==1.2.0", "mistune==3.2.1"]

[project.urls]
Repository = "https://github.com/ulissesflores/cellular-inference-mesh"
Documentation = "https://github.com/ulissesflores/cellular-inference-mesh/tree/main/docs"
"Hash chain" = "https://github.com/ulissesflores/cellular-inference-mesh/blob/main/docs/hash-chain.md"
"Saturated Pipeline Conjecture" = "https://github.com/ulissesflores/cellular-inference-mesh/blob/main/docs/saturated-pipeline-conjecture.md"
Changelog = "https://github.com/ulissesflores/cellular-inference-mesh/blob/main/CHANGELOG.md"
"Issue tracker" = "https://github.com/ulissesflores/cellular-inference-mesh/issues"

[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "."}
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "C4", "PIE", "SIM", "PL"]
ignore = [
  "E501",      # line-length handled separately
  "PLR0913",   # too many arguments — fine in scientific code
  "PLR2004",   # magic numbers — pervasive in formula constants
  "C408",      # dict() vs {} — readability preference in matplotlib kwargs
  "B905",      # zip(strict=) — over-cautious for paired arrays
  "N803",      # arg names lowercase — math variables (L_edge, L_cloud, M, k)
  "N806",      # var names lowercase — math variables in functions
  "PLW1510",   # subprocess.run check= — explicit in code where needed
  "SIM108",    # ternary preference — readability call
  "B007",      # unused loop var — common in matplotlib enumerate idioms
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F401", "F841", "N802", "PLC0415"]   # test conventions: imports inside fixtures, mathematical naming (M, K), unused vars in setup
"colab/*.ipynb" = ["E402", "SIM115"]      # notebook patterns differ
"scripts/pareto_proof.py" = [
  "PLR0912",   # branches in single-script main()
  "PLR0915",   # statements in single-script main()
  "B023",      # closure binding inside main() loops is intentional
]
"scripts/gen_provenance.py" = ["N812"]   # _PACKAGE_VERSION alias intentional
"src/report.py" = [
  "N806",      # G for graph is networkx convention
  "E702",      # multi-statement lines in matplotlib chained calls
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q --tb=short"
