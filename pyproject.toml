[project]
name = "cellular-inference-mesh"
version = "0.3.0"
description = "Salabim discrete-event simulation of edge-cloud LLM inference under PACELC. Companion software to the Saturated Pipeline Conjecture (Flores, 2026)."
authors = [{name = "Carlos Ulisses Flores", email = "c.ulisses@gmail.com"}]
license = "Apache-2.0"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.12"
keywords = [
  "cellular inference mesh",
  "saturated pipeline conjecture",
  "PACELC",
  "speculative decoding",
  "edge-cloud LLM inference",
  "multilingual AGV",
  "LLMOps",
  "salabim",
  "discrete-event simulation",
  "FAIR research software",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: System :: Distributed Computing",
]
dependencies = [
  "salabim==26.0.5",
  "numpy==2.4.4",
  "scipy==1.17.1",
  "matplotlib==3.10.9",
  "seaborn==0.13.2",
  "networkx==3.6.1",
  "pandas==3.0.2",
  "scienceplots==2.2.1",
]

[project.optional-dependencies]
dev = ["pytest==9.0.3", "ruff==0.5.7"]
build = ["python-docx==1.2.0", "mistune==3.2.1"]

[project.urls]
Repository = "https://github.com/ulissesflores/cellular-inference-mesh"
Documentation = "https://github.com/ulissesflores/cellular-inference-mesh/tree/main/docs"
"Hash chain" = "https://github.com/ulissesflores/cellular-inference-mesh/blob/main/docs/hash-chain.md"
"Saturated Pipeline Conjecture" = "https://github.com/ulissesflores/cellular-inference-mesh/blob/main/docs/saturated-pipeline-conjecture.md"
Changelog = "https://github.com/ulissesflores/cellular-inference-mesh/blob/main/CHANGELOG.md"
"Issue tracker" = "https://github.com/ulissesflores/cellular-inference-mesh/issues"

[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "."}
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "C4", "PIE", "SIM", "PL"]
ignore = ["E501", "PLR0913", "PLR2004"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q --tb=short"
