name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  smoke:
    name: Smoke + lint + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies (editable + dev extras)
        run: pip install -e ".[dev]"

      - name: Lint with ruff
        run: ruff check src/ tests/ scripts/

      - name: Run pytest (53 tests, ~5.5 s)
        run: pytest -q --tb=short

      - name: Run smoke simulation (1 replica × 60 s)
        run: python -m src.main --smoke

      - name: Render figures
        run: python -m src.report

      - name: Upload smoke artifacts
        uses: actions/upload-artifact@v4
        with:
          name: smoke-output
          path: output/
          retention-days: 7
